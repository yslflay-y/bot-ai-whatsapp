version: "3.8"

networks:
  internal_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  assistant_data:

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL: Primary Relational Persistence
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp_assistant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-assistant} -d $${POSTGRES_DB:-whatsapp_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network
    # PostgreSQL is NOT exposed to public internet for security

  # ----------------------------------------------------------------------------
  # Redis: BullMQ Job Queue & Caching
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: whatsapp_assistant_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network
    # Redis is NOT exposed to public internet for security

  # ----------------------------------------------------------------------------
  # WhatsApp AI Assistant Application
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp_assistant_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD:-securepassword}@postgres:5432/${POSTGRES_DB:-whatsapp_assistant}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEDIA_STORAGE_PATH: /app/data/media
      AUTH_STATE_PATH: /app/data/auth
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - assistant_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network
